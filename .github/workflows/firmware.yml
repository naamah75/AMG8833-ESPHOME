name: Firmware
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  algorithm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -Wall -Wextra -Werror -I. tests/test_presence.cpp -o /tmp/test-presence
      - run: /tmp/test-presence
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install esphome==2026.10.0
      - run: cp secrets.yaml.example secrets.yaml
      - run: esphome config amg8833.yaml
      - run: esphome compile amg8833.yaml
