esphome:
  name: amg8833
  friendly_name: Thermal
  min_version: 2026.10.0

esp8266:
  board: d1_mini_pro

external_components:
  - source:
      type: local
      path: components

wifi:
  ssid: !secret ssid
  password: !secret password

logger:
api:
ota:
  - platform: esphome

i2c:
  sda: D2
  scl: D1
  scan: true
  frequency: 100kHz

amg8833:
  address: 0x69
  update_interval: 1s
  raw_pixels:
    name: Sensor Raw Pixels
  pixels:
    name: Sensor Pixels
    id: thermal_pixels
  temperature:
    name: Thermal Sensor Temperature
  minimum:
    name: Thermal Sensor Min
    id: thermal_min
  maximum:
    name: Thermal Sensor Max
    id: thermal_max
  average:
    name: Thermal Sensor Avg

binary_sensor:
  - platform: template
    name: Thermal Contrast Detected
    device_class: occupancy
    lambda: |-
      if (!id(thermal_min).has_state() || !id(thermal_max).has_state()) return {};
      return id(thermal_max).state - id(thermal_min).state > 4.0f;
    filters:
      - delayed_off: 5s
